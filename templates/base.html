<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Notely{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'notely/site.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'notes:list' %}">Notely</a>
    {% if request.user.is_authenticated %}
      <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}<button class="button button-light" type="submit">Sign out</button>
      </form>
    {% endif %}
  </header>
  <main class="container">
    {% for message in messages %}
      <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
