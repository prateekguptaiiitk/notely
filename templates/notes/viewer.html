{% extends 'base.html' %}
{% load static %}
{% block title %}{{ note.title }} | Notely{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'notes:list' %}">Back to notes</a>
<h1>{{ note.title }}</h1>
{% if note.description %}<p class="description">{{ note.description }}</p>{% endif %}
<section class="viewer">
  <div class="visible-watermark">copyright @Notely</div>
  {% for page in pages %}
    <canvas class="note-page lazy-page" width="{{ page.width }}" height="{{ page.height }}"
      data-src="{% url 'notes:page' note.slug page.page_number %}"
      aria-label="Page {{ page.page_number }}"></canvas>
  {% endfor %}
  <div class="interaction-shield" aria-hidden="true"></div>
</section>
<script src="{% static 'notely/viewer.js' %}" defer></script>
{% endblock %}
