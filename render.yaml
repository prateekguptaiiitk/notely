services:
  - type: web
    name: notely
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py findstatic notely/site.css --verbosity 0 && python manage.py collectstatic --clear --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PRIVATE_STORAGE_BACKEND
        value: s3
      - key: PRIVATE_STORAGE_DIR
        value: /tmp/notely-private
      - key: PRIVATE_S3_ENDPOINT_URL
        sync: false
      - key: PRIVATE_S3_REGION
        sync: false
      - key: PRIVATE_S3_BUCKET
        sync: false
      - key: PRIVATE_S3_ACCESS_KEY_ID
        sync: false
      - key: PRIVATE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_URL
        value: admin/
      - key: SINGLE_SESSION_POLICY
        value: replace
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_PDF_PAGES
        value: "30"
